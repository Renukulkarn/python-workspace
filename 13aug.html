<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>student info</h1>
        <form>
            <table border="1">
                <tr>
                    <td>username</td>
                    <td><input type="text" placeholder="Enter your name"></td>
                </tr>
                 <tr>
                    <td>Address</td>
                    <td><textarea name="address" rows="5" cols="20" placeholder="address"></textarea></td>
                </tr>
                 <tr>
                    <td>skills</td>
                    <td>
                        python<input type="checkbox" name="Python">
                        css<input type="checkbox" name="css">
                        Dsa<input type="checkbox" name="DSA">
                        Angular<input type="checkbox" name="Angular">
                    </td>
                </tr>
                 <tr>
                    <td>Gender</td>
                    <td>
                        male<input type="radio" name="gender">
                        Female<input type="radio" name="gender">
                        other<input type="radio" name="gender">
                    </td>
                </tr>
                <tr>
                    <td>Country:</td>
                    <td>
                        <select name="country">
                            <option value="in">India</option>
                            <option value="us">United States</option>
                            <option value="cn">China</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <button type="submit">Register</button>
                    </td>
                </tr>
                

            </table>
        </form>
    </center>
</body>
</html>
