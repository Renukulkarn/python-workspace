<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile Card</title>
</head>

<body>
    <main class="profile-card">
        <h1>Employee Profile Card</h1>
        <p class="intro">Employee details requested by Infosys HR.</p>

        <dl class="details">
            <div>
                <dt>Company name</dt>
                <dd>Google</dd>
            </div>
            <div>
                <dt>Employee name</dt>
                <dd>Renu Kulkarni</dd>
            </div>
            <div>
                <dt>Designation</dt>
                <dd>Software Engineer</dd>
            </div>
            <div>
                <dt>Department</dt>
                <dd>IT</dd>
            </div>
            <div>
                <dt>Experience</dt>
                <dd>1 year</dd>
            </div>
            <div>
                <dt>Skills</dt>
                <dd>Python, HTML</dd>
            </div>
            <div>
                <dt>Notice period</dt>
                <dd>30 days</dd>
            </div>
            <div>
                <dt>Joining date</dt>
                <dd>30 August 2026</dd>
            </div>
        </dl>
    </main>
</body>

</html>
