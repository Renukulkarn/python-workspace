<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal</title>

    <style>
        
        div.div4 {
            background-color: rgb(214, 195, 195);
            height: 400px;
            width: 200px;
            margin-left: 200px;
            padding-top: 20px;
        }

        
        h1 {
            text-align: center;
            font-size: 25px;
        }

        
       div.div1,div.div2,div.div3 {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            margin: 20px auto;
        }

        
        div.div1 {
            background-color: red;
        }

       
        div.div2 {
            background-color: green;
        }

        
        div.div3 {
            background-color: yellow;
        }
    </style>

</head>

<body>

    <div class="div4">

        <h1>Traffic Signal</h1>

        <div class="div1"></div>

        <div class="div2"></div>

        <div class="div3"></div>

    </div>

</body>

</html>
